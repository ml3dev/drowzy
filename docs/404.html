<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0c0817">
<meta name="robots" content="noindex">
<title>Drowzy · Page not found</title>
<link rel="icon" href="https://ml3dev.github.io/drowzy/icon-128.png">
<style>
:root{
  --bg:#0c0817;--text:#ece7f6;--text-dim:#a99fc0;--text-faint:#7a6f93;
  --accent:#a78bfa;--accent-bright:#c4b5fd;
  --border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.14);
  --grad:linear-gradient(135deg,#b89cfd 0%,#8b5cf6 100%);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);color:var(--text);line-height:1.6;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:32px 20px;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(120% 90% at 78% -8%, rgba(139,92,246,.30), transparent 55%),
    radial-gradient(90% 70% at 8% 8%, rgba(96,165,250,.12), transparent 50%),
    linear-gradient(180deg,#0c0817 0%, #0a0614 100%);
}
main{max-width:480px;width:100%;text-align:center}
.logo{width:72px;height:72px;margin:0 auto 22px;display:block}
.code{font-size:12.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
h1{font-size:clamp(28px,6vw,40px);font-weight:700;letter-spacing:-.025em;line-height:1.1;margin-bottom:14px}
h1 em{font-style:normal;color:var(--accent-bright)}
p{color:var(--text-dim);font-size:16px;max-width:40ch;margin:0 auto 30px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;padding:12px 22px;border-radius:12px;
  text-decoration:none;border:1px solid transparent;transition:transform .2s,border-color .2s}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 10px 30px -8px rgba(139,92,246,.75)}
.btn-ghost{background:rgba(255,255,255,.03);color:var(--text);border-color:var(--border-strong)}
.btn:hover{transform:translateY(-2px)}
.btn-ghost:hover{border-color:var(--accent)}
.foot{margin-top:34px;font-size:13px;color:var(--text-faint)}
.foot a{color:var(--text-dim)}
</style>
</head>
<body>
<main>
  <img class="logo" src="https://ml3dev.github.io/drowzy/icon-512.png" alt="Drowzy logo" width="72" height="72">
  <div class="code">404</div>
  <h1>This page is <em>asleep for good</em>.</h1>
  <p>There is nothing at this address. It may have moved, or the link was never right to begin with.</p>
  <div class="row">
    <a class="btn btn-primary" href="https://ml3dev.github.io/drowzy/">Back to Drowzy</a>
    <a class="btn btn-ghost" href="https://github.com/ml3dev/drowzy">View on GitHub</a>
  </div>
  <p class="foot">Looking for the <a href="https://ml3dev.github.io/drowzy/privacy-policy.html">privacy policy</a> or the <a href="https://chromewebstore.google.com/detail/drowzy-tab-suspender-memo/oijfnkaakdamnijjgehjpfmclhigmapa">Chrome Web Store listing</a>?</p>
</main>
</body>
</html>
