<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drowzy</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body {
      width: 100%;
      max-height: none;
      overflow: auto;
    }
    .popup-container {
      max-height: none;
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="header-left">
        <svg class="logo-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" fill="currentColor" opacity="0.9"/>
        </svg>
        <span class="header-title">Drowzy</span>
      </div>
      <div class="header-actions">
        <button class="btn-icon-only" id="themeToggle" aria-label="Toggle theme"></button>
      </div>
    </header>

    <div class="stats-strip">
      <div class="strip-stat">
        <span class="strip-stat-value" id="statSleepingValue">0</span>
        <span class="strip-stat-label" data-i18n="statSleeping">sleeping</span>
      </div>
      <div class="strip-divider"></div>
      <div class="strip-stat">
        <span class="strip-stat-value" id="statProtectedValue">0</span>
        <span class="strip-stat-label" data-i18n="statProtected">protected</span>
      </div>
      <div class="strip-divider"></div>
      <div class="strip-stat" data-i18n-title="ramEstimateTooltip" title="Estimated using ~150 MB per suspended tab. Actual savings vary by page.">
        <span class="strip-stat-value" id="statMemoryValue">&mdash;</span>
        <span class="strip-stat-label" data-i18n="statSaved">saved</span>
      </div>
    </div>

    <div class="quick-actions">
      <button class="btn btn-primary" id="btnSuspendOthers">
        <span class="btn-icon" data-icon="pauseCircle"></span>
        <span class="btn-text" data-i18n="suspendOthers">Suspend Others</span>
      </button>
      <button class="btn" id="btnWakeAll">
        <span class="btn-icon" data-icon="playCircle"></span>
        <span class="btn-text" data-i18n="wakeAll">Wake All</span>
      </button>
    </div>

    <div class="main-content">
      <div class="review-prompt" id="reviewPrompt" style="display:none;">
        <span class="review-prompt-text" data-i18n="enjoyingDrowzy">Enjoying Drowzy?</span>
        <div class="review-prompt-actions">
          <button class="review-prompt-btn review-prompt-yes" id="reviewThumbsUp" title="Leave a quick review">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2h0a3.13 3.13 0 0 1 3 3.88Z"/></svg>
            <span data-i18n="reviewYes">Yes!</span>
          </button>
          <button class="review-prompt-btn review-prompt-no" id="reviewThumbsDown" title="Report an issue">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22h0a3.13 3.13 0 0 1-3-3.88Z"/></svg>
            <span data-i18n="reviewNo">Not really</span>
          </button>
        </div>
        <button class="review-prompt-dismiss" id="reviewDismiss" title="Dismiss">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>

      <div class="current-tab" id="currentTabSection">
        <div class="current-tab-info">
          <img class="favicon" id="currentTabFavicon" alt="">
          <div class="current-tab-details">
            <div class="current-tab-domain" id="currentTabDomain">&mdash;</div>
            <div class="current-tab-status" id="currentTabStatus" data-i18n="loading">Loading...</div>
          </div>
        </div>
        <button class="btn btn-whitelist" id="btnToggleWhitelist">
          <span class="btn-icon" data-icon="shield"></span>
          <span class="btn-text" data-i18n="neverSuspendSite">Never suspend this site</span>
        </button>
      </div>

      <div class="tab-list-header">
        <span class="section-label" data-i18n="tabsInWindow">Tabs in this window</span>
        <div class="tab-list-header-actions">
          <button class="btn-icon-only" id="btnCloseDuplicates" data-i18n-title="closeDuplicatesTitle" title="Close duplicate tabs">
            <span data-icon="copy"></span>
          </button>
          <button class="btn-icon-only" id="btnSearchToggle" data-i18n-title="searchTabs" title="Search tabs">
            <span data-icon="search"></span>
          </button>
          <button class="btn-icon-only" id="btnExportTabs" data-i18n-title="copyTabsTitle" title="Copy tab list to clipboard">
            <span data-icon="clipboard"></span>
          </button>
        </div>
      </div>
      <div class="tab-search" id="tabSearchWrap" style="display:none;">
        <input type="text" id="tabSearchInput" class="input" data-i18n-placeholder="searchTabs" placeholder="Search tabs...">
      </div>
      <div class="tab-list" id="tabList">
        <div class="tab-list-empty is-loading">
          <span class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></span>
          <span data-i18n="loadingTabs">Loading tabs...</span>
        </div>
      </div>

      <div class="sections-area">
        <div class="collapsible-section">
          <button class="section-toggle" id="sessionsToggle" aria-expanded="false" aria-controls="sessionsBody">
            <span class="section-toggle-left">
              <span data-icon="folderOpen"></span>
              <span data-i18n="sessions">Sessions</span>
            </span>
            <span class="section-chevron" data-icon="chevronRight"></span>
          </button>
          <div class="section-body" id="sessionsBody">
            <div class="section-body-inner">
              <div class="session-save-row">
                <input type="text" id="sessionNameInput" class="input" data-i18n-placeholder="sessionNamePlaceholder" placeholder="Session name (optional)">
                <button class="btn btn-sm" id="btnSaveSession">
                  <span data-icon="save"></span>
                  <span data-i18n="save">Save</span>
                </button>
                <button class="btn btn-sm" id="btnExportSessions" data-i18n-title="copySessionsTitle" title="Copy all sessions as JSON">
                  <span data-icon="clipboard"></span>
                </button>
              </div>
              <div class="session-feedback" id="sessionFeedback"></div>
              <div class="session-list" id="sessionList">
                <div class="empty-state">
                  <span class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg></span>
                  <span data-i18n="emptySessionState">Save your first session to restore tabs anytime</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="collapsible-section">
          <button class="section-toggle" id="statsToggle" aria-expanded="false" aria-controls="statsBody">
            <span class="section-toggle-left">
              <span data-icon="barChart3"></span>
              <span data-i18n="stats">Stats</span>
            </span>
            <span class="section-chevron" data-icon="chevronRight"></span>
          </button>
          <div class="section-body" id="statsBody">
            <div class="section-body-inner">
              <div class="stat-hero" data-i18n-title="ramEstimateTooltip" title="Estimated using ~150 MB per suspended tab. Actual savings vary by page.">
                <span class="stat-hero-icon" data-icon="zap"></span>
                <div class="stat-hero-content">
                  <span class="stat-hero-value" id="statRamAllTime">&mdash;</span>
                  <span class="stat-hero-label" data-i18n="statLifetimeRam">Lifetime RAM saved</span>
                </div>
              </div>
              <div class="stats-grid">
                <div class="stat-card">
                  <span class="stat-card-icon" data-icon="moon" data-icon-size="12"></span>
                  <div class="stat-card-content">
                    <span class="stat-card-value" id="statToday">0</span>
                    <span class="stat-card-label" data-i18n="statToday">Today</span>
                  </div>
                </div>
                <div class="stat-card">
                  <span class="stat-card-icon" data-icon="barChart3" data-icon-size="12"></span>
                  <div class="stat-card-content">
                    <span class="stat-card-value" id="statAllTime">0</span>
                    <span class="stat-card-label" data-i18n="statAllTime">All time</span>
                  </div>
                </div>
              </div>
              <div class="stats-footer">
                <span class="stat-member" id="statMemberSince">&mdash;</span>
                <button class="btn btn-sm" id="btnShareStats">
                  <span data-icon="clipboard" data-icon-size="11"></span>
                  <span data-i18n="shareStats">Share</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="collapsible-section">
          <button class="section-toggle" id="settingsToggle" aria-expanded="false" aria-controls="settingsBody">
            <span class="section-toggle-left">
              <span data-icon="settings"></span>
              <span data-i18n="settings">Settings</span>
            </span>
            <span class="section-chevron" data-icon="chevronRight"></span>
          </button>
          <div class="section-body" id="settingsBody">
            <div class="section-body-inner">
              <div class="setting-row">
                <label for="suspendTimer" data-i18n="autoSuspendAfter">Auto-suspend after</label>
                <select id="suspendTimer" class="select">
                  <option value="5" data-i18n="timer5min">5 minutes</option>
                  <option value="10" data-i18n="timer10min">10 minutes</option>
                  <option value="15" data-i18n="timer15min">15 minutes</option>
                  <option value="30" data-i18n="timer30min">30 minutes</option>
                  <option value="60" data-i18n="timer1hour">1 hour</option>
                  <option value="120" data-i18n="timer2hours">2 hours</option>
                  <option value="240" data-i18n="timer4hours">4 hours</option>
                  <option value="0" data-i18n="timerNever">Never</option>
                </select>
              </div>
              <div class="setting-row">
                <label for="togglePinned" data-i18n="protectPinned">Protect pinned tabs</label>
                <label class="switch"><input type="checkbox" id="togglePinned"><span class="slider"></span></label>
              </div>
              <div class="setting-row">
                <label for="toggleAudio" data-i18n="protectAudio">Protect audio tabs</label>
                <label class="switch"><input type="checkbox" id="toggleAudio"><span class="slider"></span></label>
              </div>
              <div class="setting-row">
                <label for="toggleForms" data-i18n="protectForms">Protect tabs with forms</label>
                <label class="switch"><input type="checkbox" id="toggleForms"><span class="slider"></span></label>
              </div>
              <div class="setting-row">
                <label for="toggleStartup" data-i18n="suspendOnStartup">Suspend tabs on startup</label>
                <label class="switch"><input type="checkbox" id="toggleStartup"><span class="slider"></span></label>
              </div>
              <div class="setting-row">
                <label for="toggleAutoSuspend" data-i18n="enableAutoSuspend">Enable auto-suspend</label>
                <label class="switch"><input type="checkbox" id="toggleAutoSuspend"><span class="slider"></span></label>
              </div>
              <div class="setting-row">
                <label for="toggleMarkSuspended" data-i18n="markSuspended">Mark suspended tabs</label>
                <label class="switch"><input type="checkbox" id="toggleMarkSuspended"><span class="slider"></span></label>
              </div>
              <div class="setting-row setting-row-block">
                <label data-i18n="whitelistedSites">Whitelisted sites</label>
                <div class="whitelist-add">
                  <input type="text" id="whitelistInput" data-i18n-placeholder="whitelistPlaceholder" placeholder="example.com or site.com/path/*" class="input">
                  <button class="btn btn-sm" id="btnAddWhitelist">
                    <span data-icon="plus"></span>
                    <span data-i18n="add">Add</span>
                  </button>
                </div>
                <ul class="whitelist-list" id="whitelistList"></ul>
                <div class="whitelist-io">
                  <button class="btn btn-sm" id="btnExportWhitelist" data-i18n-title="exportWhitelistTitle" title="Copy whitelist">
                    <span data-icon="clipboard"></span>
                    <span data-i18n="exportWhitelist">Export</span>
                  </button>
                  <button class="btn btn-sm" id="btnImportWhitelist" data-i18n-title="importWhitelistTitle" title="Import whitelist from clipboard">
                    <span data-icon="download"></span>
                    <span data-i18n="importWhitelist">Import</span>
                  </button>
                </div>
              </div>
              <div class="setting-row">
                <a class="settings-link" id="btnWhatsNew" href="#" data-i18n="whatsNew">What's new</a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="popup-footer">
        <span class="footer-version"></span>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="icons.js"></script>
  <script src="popup.js"></script>
</body>
</html>
